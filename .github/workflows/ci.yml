name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-demo:
    name: Safety evidence demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Verify lock target platform
        run: |
          python - <<'PY'
          import platform
          import sys

          assert sys.implementation.name == "cpython"
          assert sys.version_info[:2] == (3, 12)
          assert platform.system() == "Linux"
          assert platform.machine() == "x86_64"
          PY
          python -m venv /tmp/agent-safety-download-check

      # actions/setup-python exposes the selected 3.12 runtime as `python`.
      # The current locked agent-guard release recognizes this form in workflow evidence.
      - name: Verify locked dependencies resolve from public PyPI
        run: /tmp/agent-safety-download-check/bin/python -m pip download --index-url https://pypi.org/simple --no-deps --require-hashes -r requirements/agent-safety-tools.txt --dest /tmp/agent-safety-downloads

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements/agent-safety-tools.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check guard workflow wiring
        run: python -I -m agent_guard.cli surface inventory --root . --context-policy .agent-guard/context-policy.yaml --schema-version v2 --json

      # Public 0.3.8 inventory does not yet index the isolated module form.
      # Keep this real compatibility scan until the pinned guard is updated.
      - name: Check published guard workflow surface compatibility
        run: agent-guard surface inventory --root . --context-policy .agent-guard/context-policy.yaml --schema-version v2 --json

      - name: Run end-to-end demo
        run: bash scripts/run_demo.sh

      - name: Verify committed evidence samples are current
        run: git diff --exit-code -- .agent-guard/evidence/agent-guard-report.json .agent-guard/evidence/agent-guard-evidence-pack.json .agent-policy/evidence/policy-admission-event.json
